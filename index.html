<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Rapport EMBK</title><style>body{margin:0;background:#f3f4f6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#111827}.load{max-width:760px;margin:40px auto;padding:20px}.box{background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 14px #0001}</style></head><body><div class="load"><div class="box"><b>Chargement de l’application…</b></div></div><script>(async()=>{try{let h=await fetch('app.html?v=photo-fix-1',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Chargement impossible');return r.text()});h=h.replace("const f=inp.files&&inp.files[0];","const f=(inp.files&&inp.files[0])||inp._savedBlob;");h=h.replace("const f=inp.files?.[0]||null;","const f=inp.files?.[0]||inp._savedBlob||null;");h=h.replace("function setFile(input,p){if(!p?.blob)return;try{const file=p.blob instanceof File?p.blob:new File([p.blob],p.name||'photo.jpg',{type:p.type||'image/jpeg',lastModified:p.lastModified||Date.now()});const dt=new DataTransfer();dt.items.add(file);input.files=dt.files}catch(e){console.error('Restauration photo',e)}}","function setFile(input,p){if(!p?.blob)return;const file=p.blob instanceof File?p.blob:new File([p.blob],p.name||'photo.jpg',{type:p.type||'image/jpeg',lastModified:p.lastModified||Date.now()});input._savedBlob=file;try{const dt=new DataTransfer();dt.items.add(file);input.files=dt.files}catch(e){console.warn('Photo restaurée depuis le stockage local',e)}}");document.open();document.write(h);document.close()}catch(e){document.body.innerHTML='<div class="load"><div class="box"><b>Erreur de chargement</b><p>'+String(e.message||e)+'</p></div></div>'}})();</script></body></html>
