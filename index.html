<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Rapport EMBK</title><style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}header{position:sticky;top:0;z-index:30;background:#111827;color:#fff;padding:15px 16px;font-weight:800;font-size:19px}main{max-width:760px;margin:auto;padding:15px 15px 115px}.card{background:#fff;border-radius:17px;padding:18px;margin:0 0 15px;box-shadow:0 2px 14px #0001;scroll-margin-top:72px}.kicker{font-size:12px;font-weight:800;color:#64748b;text-transform:uppercase;letter-spacing:.04em}h2{font-size:22px;margin:7px 0 14px}h3{font-size:18px;margin:18px 0 9px}.muted{font-size:14px;color:#64748b;line-height:1.45}.mini{font-size:12px;color:#64748b}label{display:block;font-weight:750;margin:11px 0 7px}input[type=text],input[type=date]{width:100%;height:54px;border:2px solid #cbd5e1;border-radius:12px;padding:0 14px;font-size:17px;background:#fff;color:#111827}input[type=file]{width:100%;font-size:15px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice input{position:absolute;opacity:0;pointer-events:none}.choice label{margin:0;background:#e5e7eb;border-radius:12px;padding:14px;text-align:center;cursor:pointer}.choice input:checked+label{outline:3px solid #111827;background:#dbeafe}.photo{border:1px dashed #94a3b8;border-radius:12px;padding:12px;margin:9px 0;background:#f8fafc}.replacement-wrap{display:none}.replacement-wrap.show{display:block}.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:800;text-decoration:none;text-align:center;cursor:pointer;margin-top:12px}.primary{background:#111827;color:#fff}.secondary{background:#e5e7eb;color:#111827}.success{background:#047857;color:#fff}.danger{background:#fee2e2;color:#b91c1c}.vehicle-block{border-left:5px solid #111827}.toolbar{position:fixed;bottom:0;left:0;right:0;z-index:40;background:#fff;border-top:1px solid #d1d5db;padding:10px 15px calc(10px + env(safe-area-inset-bottom))}.toolbar>div{max-width:760px;margin:auto;display:flex;gap:10px}.toolbar .btn{margin:0}.status{padding:10px 12px;border-radius:12px;background:#ecfdf5;color:#065f46;font-size:14px;margin-top:12px;display:none}.status.show{display:block}.warn{background:#fff7ed;color:#9a3412}.vehicle-actions{display:flex;gap:8px}.vehicle-actions .btn{margin:0}.vehicle-actions .remove{max-width:130px}@media(max-width:560px){.row{grid-template-columns:1fr}.toolbar>div{display:grid;grid-template-columns:1fr 1fr}.vehicle-actions{display:block}.vehicle-actions .remove{max-width:none}}
</style></head><body><header>Rapport EMBK</header><main>
<section class="card" id="general"><div class="kicker">Rapport</div><h2>Informations générales</h2><label>Numéro du train</label><input id="train" type="text" placeholder="Ex. 502-401"><label>Date de l’intervention</label><input id="baseDate" type="date"><label>Nom et prénom de l’opérateur</label><input id="baseOperator" type="text" placeholder="Nom Prénom"><h3>Informations communes</h3><label>Date commune à tous les véhicules ?</label><div class="row choice"><div><input id="dateY" type="radio" name="dateCommon" value="Oui"><label for="dateY">Oui</label></div><div><input id="dateN" type="radio" name="dateCommon" value="Non"><label for="dateN">Non</label></div></div><label>Opérateur commun à tous les véhicules ?</label><div class="row choice"><div><input id="opY" type="radio" name="opCommon" value="Oui"><label for="opY">Oui</label></div><div><input id="opN" type="radio" name="opCommon" value="Non"><label for="opN">Non</label></div></div><a class="btn primary" href="#vehicles">Continuer</a></section>
<section id="vehicles"></section><section class="card" id="end"><div class="kicker">Fin</div><h2>Rapport terminé</h2><p class="muted">Ajoute autant de véhicules que nécessaire. Quand tout est rempli, appuie sur <b>Générer le PDF</b>.</p><button id="addVehicle" class="btn secondary" type="button">+ Ajouter un véhicule</button><button id="generatePdf" class="btn success" type="button">Générer le PDF</button><div id="status" class="status"></div></section></main><div class="toolbar"><div><button id="addVehicleBottom" class="btn secondary" type="button">+ Véhicule</button><button id="generatePdfBottom" class="btn success" type="button">Générer PDF</button></div></div>
<script>(function(){'use strict';const $=s=>document.querySelector(s),$$=(s,r=document)=>Array.from(r.querySelectorAll(s));let counter=0;
function sideHtml(id,side,label){const p=id+'_'+side;return `<div class="card embk-side" id="${p}"><div class="kicker">${label}</div><h2>EMBK ${label.toLowerCase()}</h2><label>Avons-nous réutilisé le même EMBK ?</label><div class="row choice"><div><input id="${p}_embkY" type="radio" name="${p}_embk" value="Oui"><label for="${p}_embkY">Oui</label></div><div><input id="${p}_embkN" type="radio" name="${p}_embk" value="Non"><label for="${p}_embkN">Non</label></div></div><h3>Ancien numéro de série</h3><div class="photo"><label>Photo 1</label><input data-label="Ancien numéro de série - Photo 1" type="file" accept="image/*" capture="environment"></div><div class="photo"><label>Photo 2</label><input data-label="Ancien numéro de série - Photo 2" type="file" accept="image/*" capture="environment"></div><div class="replacement-wrap"><h3>EMBK utilisé pour le remplacement</h3><div class="photo replacement"><label>Photo 1</label><input data-label="EMBK utilisé pour le remplacement - Photo 1" type="file" accept="image/*" capture="environment"></div><div class="photo replacement"><label>Photo 2</label><input data-label="EMBK utilisé pour le remplacement - Photo 2" type="file" accept="image/*" capture="environment"></div></div><div class="photo"><label>État de la bobine</label><input data-label="État de la bobine" type="file" accept="image/*" capture="environment"></div><div class="photo"><label>Mesure de résistance</label><input data-label="Mesure de résistance" type="file" accept="image/*" capture="environment"></div><label>Valeur de résistance (Ω)</label><input class="res-value" type="text" placeholder="Ex. 470,24"><label>Avons-nous réutilisé la même bobine ?</label><div class="row choice"><div><input id="${p}_coilY" type="radio" name="${p}_coil" value="Oui"><label for="${p}_coilY">Oui</label></div><div><input id="${p}_coilN" type="radio" name="${p}_coil" value="Non"><label for="${p}_coilN">Non</label></div></div><div class="photo"><label>Nouveau numéro de série</label><input data-label="Nouveau numéro de série" type="file" accept="image/*" capture="environment"></div></div>`}
function wireReplacement(root){$$('input[type=radio][name$="_embk"]',root).forEach(r=>r.addEventListener('change',()=>{const side=r.closest('.embk-side');const wrap=side.querySelector('.replacement-wrap');wrap.classList.toggle('show',r.value==='Non'&&r.checked)}))}
function addVehicle(){counter++;const id='v'+counter,wrap=document.createElement('section');wrap.className='vehicle';wrap.innerHTML=`<div class="card vehicle-block" id="${id}"><div class="kicker">Véhicule ${counter}</div><h2>Informations du véhicule</h2><label>Numéro du véhicule</label><input class="vehicle-number" type="text" placeholder="Ex. H10"><label>Date de ce véhicule <span class="mini">(si différente)</span></label><input class="vehicle-date" type="date"><label>Opérateur de ce véhicule <span class="mini">(si différent)</span></label><input class="vehicle-operator" type="text" placeholder="Nom Prénom"><div class="vehicle-actions"><a class="btn primary" href="#${id}_left">Continuer vers EMBK gauche</a>${counter>1?'<button class="btn danger remove" type="button">Supprimer</button>':''}</div></div>${sideHtml(id,'left','GAUCHE')}<div class="card"><a class="btn primary" href="#${id}_right">Continuer vers EMBK droit</a></div>${sideHtml(id,'right','DROIT')}<div class="card"><a class="btn primary" href="#end">Véhicule terminé</a></div>`;$('#vehicles').appendChild(wrap);wireReplacement(wrap);const rm=wrap.querySelector('.remove');if(rm)rm.onclick=()=>wrap.remove();setTimeout(()=>document.getElementById(id).scrollIntoView({behavior:'smooth'}),50)}
function checked(name,root=document){const x=root.querySelector(`input[name="${name}"]:checked`);return x?x.value:''}function ascii(s=''){return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[–—]/g,'-').replace(/[^\x20-\x7E]/g,' ')}function fmtDate(s){if(!s)return '';const a=s.split('-');return a.length===3?`${a[2]}/${a[1]}/${a[0]}`:s}function escPdf(s){return ascii(s).replace(/[\\()]/g,m=>'\\'+m)}
async function fileToJpeg(file){if(!file)return null;const url=URL.createObjectURL(file);try{const img=await new Promise((ok,no)=>{const x=new Image();x.onload=()=>ok(x);x.onerror=no;x.src=url});const max=1500,sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.max(1,Math.round(img.naturalWidth*sc)),h=Math.max(1,Math.round(img.naturalHeight*sc));const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);const data=c.toDataURL('image/jpeg',.80),bin=atob(data.split(',')[1]),out=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);return{bytes:out,w,h}}finally{URL.revokeObjectURL(url)}}function bytes(s){return new TextEncoder().encode(s)}function join(parts){const n=parts.reduce((a,b)=>a+b.length,0),o=new Uint8Array(n);let p=0;for(const b of parts){o.set(b,p);p+=b.length}return o}
function tablePage(title,rows){return{kind:'table',title,rows}}function photoPage(title,label,image){return{kind:'photo',title,label,image}}
function makePdf(pages){const objs=[null],add=x=>(objs.push(x),objs.length-1),font=add(bytes('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>')),fontB=add(bytes('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold >>')),pagesId=add(null),pageIds=[];for(const pg of pages){let imgId=null;if(pg.image){const h=bytes(`<< /Type /XObject /Subtype /Image /Width ${pg.image.w} /Height ${pg.image.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${pg.image.bytes.length} >>\nstream\n`);imgId=add(join([h,pg.image.bytes,bytes('\nendstream')]))}let c=`BT /FB 18 Tf 45 795 Td (${escPdf(pg.title)}) Tj ET\n`;if(pg.kind==='table'){let y=755;const x=45,w1=190,w2=315,h=32;c+='0.92 g\n';for(let i=0;i<pg.rows.length;i++){c+=`${x} ${y-h+5} ${w1} ${h} re f\n`;c+='0 g\n';c+=`${x} ${y-h+5} ${w1+w2} ${h} re S\n${x+w1} ${y-h+5} 0 ${h} re S\n`;c+=`BT /FB 10 Tf ${x+8} ${y-15} Td (${escPdf(pg.rows[i][0])}) Tj ET\n`;c+=`BT /F1 10 Tf ${x+w1+8} ${y-15} Td (${escPdf(pg.rows[i][1])}) Tj ET\n`;y-=h}}else{c+=`BT /FB 11 Tf 45 765 Td (${escPdf(pg.label)}) Tj ET\n`;if(pg.image){const mw=430,mh=470,sc=Math.min(mw/pg.image.w,mh/pg.image.h),dw=pg.image.w*sc,dh=pg.image.h*sc,x=(595-dw)/2,y=720-dh;c+=`q ${dw.toFixed(2)} 0 0 ${dh.toFixed(2)} ${x.toFixed(2)} ${y.toFixed(2)} cm /Im1 Do Q\n`}}const cb=bytes(c),cid=add(join([bytes(`<< /Length ${cb.length} >>\nstream\n`),cb,bytes('endstream')]));let res=`<< /Font << /F1 ${font} 0 R /FB ${fontB} 0 R >>`;if(imgId)res+=` /XObject << /Im1 ${imgId} 0 R >>`;res+=' >>';pageIds.push(add(bytes(`<< /Type /Page /Parent ${pagesId} 0 R /MediaBox [0 0 595 842] /Resources ${res} /Contents ${cid} 0 R >>`)))}objs[pagesId]=bytes(`<< /Type /Pages /Count ${pageIds.length} /Kids [${pageIds.map(i=>i+' 0 R').join(' ')}] >>`);const catalog=add(bytes(`<< /Type /Catalog /Pages ${pagesId} 0 R >>`)),out=[bytes('%PDF-1.4\n%PDFGEN\n')],offsets=[0];let off=out[0].length;for(let i=1;i<objs.length;i++){offsets[i]=off;const a=bytes(`${i} 0 obj\n`),b=bytes('\nendobj\n');out.push(a,objs[i],b);off+=a.length+objs[i].length+b.length}const xoff=off;let x=`xref\n0 ${objs.length}\n0000000000 65535 f \n`;for(let i=1;i<objs.length;i++)x+=String(offsets[i]).padStart(10,'0')+' 00000 n \n';x+=`trailer\n<< /Size ${objs.length} /Root ${catalog} 0 R >>\nstartxref\n${xoff}\n%%EOF`;out.push(bytes(x));return new Blob([join(out)],{type:'application/pdf'})}
async function gatherSide(v,key,label,pages,errors){const root=v.querySelector(`[id$="_${key}"]`),prefix=root.id,embk=checked(prefix+'_embk',root),coil=checked(prefix+'_coil',root),res=root.querySelector('.res-value').value.trim(),num=v.querySelector('.vehicle-number').value.trim()||'Véhicule';if(!embk)errors.push(`${num} - ${label}: réponse EMBK manquante`);if(!coil)errors.push(`${num} - ${label}: réponse bobine manquante`);pages.push(tablePage(`EMBK ${label}`,[['Même EMBK réutilisé ?',embk||'Non renseigné'],['Même bobine réutilisée ?',coil||'Non renseigné'],['Valeur de résistance',res?res+' Ω':'Non renseignée']]));for(const inp of $$('input[type=file]',root)){if(inp.closest('.replacement')&&embk!=='Non')continue;const f=inp.files&&inp.files[0];if(!f){errors.push(`${num} - ${label}: ${inp.dataset.label} manquante`);continue}pages.push(photoPage(`EMBK ${label}`,inp.dataset.label,await fileToJpeg(f)))}}
async function generate(){const st=$('#status');st.className='status show';st.textContent='Génération du PDF en cours...';try{const train=$('#train').value.trim(),baseDate=$('#baseDate').value,baseOp=$('#baseOperator').value.trim(),dc=checked('dateCommon'),oc=checked('opCommon'),vehicles=$$('.vehicle'),errors=[],pages=[];if(!train)errors.push('Numéro du train manquant');if(!baseDate)errors.push('Date initiale manquante');if(!baseOp)errors.push('Opérateur manquant');if(!dc)errors.push('Indique si la date est commune');if(!oc)errors.push('Indique si l’opérateur est commun');for(const v of vehicles){const num=v.querySelector('.vehicle-number').value.trim(),date=dc==='Oui'?baseDate:v.querySelector('.vehicle-date').value,op=oc==='Oui'?baseOp:v.querySelector('.vehicle-operator').value.trim();if(!num)errors.push('Numéro de véhicule manquant');if(!date)errors.push(`${num||'Véhicule'}: date manquante`);if(!op)errors.push(`${num||'Véhicule'}: opérateur manquant`);pages.push(tablePage('RAPPORT EMBK',[['Numéro du train',train],['Numéro du véhicule',num],['Nom et prénom de l’opérateur',op],['Date',fmtDate(date)]]));await gatherSide(v,'left','GAUCHE',pages,errors);await gatherSide(v,'right','DROIT',pages,errors)}if(errors.length){st.className='status show warn';st.innerHTML='<b>Il manque des informations :</b><br>'+errors.join('<br>');return}const blob=makePdf(pages),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`Rapport_EMBK_${train.replace(/[^A-Za-z0-9_-]/g,'_')}.pdf`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);st.className='status show';st.textContent='PDF généré.'}catch(err){st.className='status show warn';st.textContent='Erreur : '+err.message}}
$('#addVehicle').onclick=addVehicle;$('#addVehicleBottom').onclick=addVehicle;$('#generatePdf').onclick=generate;$('#generatePdfBottom').onclick=generate;addVehicle();})();</script></body></html>
