<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rapport EMBK</title>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}header{position:sticky;top:0;z-index:30;background:#111827;color:#fff;padding:15px 16px;font-weight:800;font-size:19px}main{max-width:760px;margin:auto;padding:15px 15px 115px}.card{background:#fff;border-radius:17px;padding:18px;margin:0 0 15px;box-shadow:0 2px 14px #0001;scroll-margin-top:72px}.kicker{font-size:12px;font-weight:800;color:#64748b;text-transform:uppercase;letter-spacing:.04em}h2{font-size:22px;margin:7px 0 14px}h3{font-size:18px;margin:18px 0 9px}.muted{font-size:14px;color:#64748b;line-height:1.45}label{display:block;font-weight:750;margin:11px 0 7px}input[type=text],input[type=date]{width:100%;height:54px;border:2px solid #cbd5e1;border-radius:12px;padding:0 14px;font-size:17px;background:#fff;color:#111827}input[type=file]{width:100%;font-size:15px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice input{position:absolute;opacity:0;pointer-events:none}.choice label{margin:0;background:#e5e7eb;border-radius:12px;padding:14px;text-align:center;cursor:pointer}.choice input:checked+label{outline:3px solid #111827;background:#dbeafe}.photo{border:1px dashed #94a3b8;border-radius:12px;padding:12px;margin:9px 0;background:#f8fafc}.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:800;text-decoration:none;text-align:center;cursor:pointer;margin-top:12px}.primary{background:#111827;color:#fff}.secondary{background:#e5e7eb;color:#111827}.success{background:#047857;color:#fff}.danger{background:#fee2e2;color:#b91c1c}.vehicle-block{border-left:5px solid #111827}.toolbar{position:fixed;bottom:0;left:0;right:0;z-index:40;background:#fff;border-top:1px solid #d1d5db;padding:10px 15px calc(10px + env(safe-area-inset-bottom))}.toolbar>div{max-width:760px;margin:auto;display:flex;gap:10px}.toolbar .btn{margin:0}.status{padding:10px 12px;border-radius:12px;background:#ecfdf5;color:#065f46;font-size:14px;margin-top:12px;display:none}.status.show{display:block}.warn{background:#fff7ed;color:#9a3412}.mini{font-size:12px;color:#64748b}.vehicle-actions{display:flex;gap:8px}.vehicle-actions .btn{margin:0}.vehicle-actions .remove{max-width:130px}
@media(max-width:560px){.row{grid-template-columns:1fr}.toolbar>div{display:grid;grid-template-columns:1fr 1fr}.vehicle-actions{display:block}.vehicle-actions .remove{max-width:none}}
</style>
</head>
<body>
<header>Rapport EMBK</header>
<main>
<section class="card" id="general">
<div class="kicker">Rapport</div><h2>Informations générales</h2>
<label>Numéro du train</label><input id="train" type="text" placeholder="Ex. 502-401">
<label>Date de l’intervention</label><input id="baseDate" type="date">
<label>Nom et prénom de l’opérateur</label><input id="baseOperator" type="text" placeholder="Nom Prénom">
<h3>Informations communes</h3>
<label>Date commune à tous les véhicules ?</label><div class="row choice"><div><input id="dateY" type="radio" name="dateCommon" value="Oui"><label for="dateY">Oui</label></div><div><input id="dateN" type="radio" name="dateCommon" value="Non"><label for="dateN">Non</label></div></div>
<label>Opérateur commun à tous les véhicules ?</label><div class="row choice"><div><input id="opY" type="radio" name="opCommon" value="Oui"><label for="opY">Oui</label></div><div><input id="opN" type="radio" name="opCommon" value="Non"><label for="opN">Non</label></div></div>
<a class="btn primary" href="#vehicles">Continuer</a>
</section>
<section id="vehicles"></section>
<section class="card" id="end"><div class="kicker">Fin</div><h2>Rapport terminé</h2><p class="muted">Ajoute autant de véhicules que nécessaire. Quand tout est rempli, appuie sur <b>Générer le PDF</b>.</p><button id="addVehicle" class="btn secondary" type="button">+ Ajouter un véhicule</button><button id="generatePdf" class="btn success" type="button">Générer le PDF</button><div id="status" class="status"></div></section>
</main>
<div class="toolbar"><div><button id="addVehicleBottom" class="btn secondary" type="button">+ Véhicule</button><button id="generatePdfBottom" class="btn success" type="button">Générer PDF</button></div></div>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s), $$=(s,r=document)=>Array.from(r.querySelectorAll(s));let counter=0;
function e(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function sideHtml(id,side,label){const p=id+'_'+side;return `<div class="card" id="${p}"><div class="kicker">${label}</div><h2>EMBK ${label.toLowerCase()}</h2><label>Avons-nous réutilisé le même EMBK ?</label><div class="row choice"><div><input id="${p}_embkY" type="radio" name="${p}_embk" value="Oui"><label for="${p}_embkY">Oui</label></div><div><input id="${p}_embkN" type="radio" name="${p}_embk" value="Non"><label for="${p}_embkN">Non</label></div></div><h3>Ancien numéro de série</h3><div class="photo"><label>Photo 1</label><input data-label="Ancien numéro de série - Photo 1" type="file" accept="image/*" capture="environment"></div><div class="photo"><label>Photo 2</label><input data-label="Ancien numéro de série - Photo 2" type="file" accept="image/*" capture="environment"></div><h3>Si l’EMBK n’a pas été réutilisé</h3><p class="mini">Ces deux photos ne seront exigées dans le PDF que si tu as répondu Non.</p><div class="photo replacement"><label>EMBK utilisé - Photo 1</label><input data-label="EMBK utilisé pour le remplacement - Photo 1" type="file" accept="image/*" capture="environment"></div><div class="photo replacement"><label>EMBK utilisé - Photo 2</label><input data-label="EMBK utilisé pour le remplacement - Photo 2" type="file" accept="image/*" capture="environment"></div><div class="photo"><label>État de la bobine</label><input data-label="État de la bobine" type="file" accept="image/*" capture="environment"></div><div class="photo"><label>Mesure de résistance</label><input data-label="Mesure de résistance" class="res-photo" type="file" accept="image/*" capture="environment"></div><label>Valeur de résistance (Ω)</label><input class="res-value" type="text" placeholder="Ex. 470,24"><label>Avons-nous réutilisé la même bobine ?</label><div class="row choice"><div><input id="${p}_coilY" type="radio" name="${p}_coil" value="Oui"><label for="${p}_coilY">Oui</label></div><div><input id="${p}_coilN" type="radio" name="${p}_coil" value="Non"><label for="${p}_coilN">Non</label></div></div><div class="photo"><label>Nouveau numéro de série</label><input data-label="Nouveau numéro de série" type="file" accept="image/*" capture="environment"></div></div>`}
function addVehicle(){counter++;const id='v'+counter;const wrap=document.createElement('section');wrap.className='vehicle';wrap.dataset.id=id;wrap.innerHTML=`<div class="card vehicle-block" id="${id}"><div class="kicker">Véhicule ${counter}</div><h2>Informations du véhicule</h2><label>Numéro du véhicule</label><input class="vehicle-number" type="text" placeholder="Ex. H10"><label>Date de ce véhicule <span class="mini">(si différente)</span></label><input class="vehicle-date" type="date"><label>Opérateur de ce véhicule <span class="mini">(si différent)</span></label><input class="vehicle-operator" type="text" placeholder="Nom Prénom"><div class="vehicle-actions"><a class="btn primary" href="#${id}_left">Continuer vers EMBK gauche</a>${counter>1?'<button class="btn danger remove" type="button">Supprimer</button>':''}</div></div>${sideHtml(id,'left','GAUCHE')}<div class="card"><a class="btn primary" href="#${id}_right">Continuer vers EMBK droit</a></div>${sideHtml(id,'right','DROIT')}<div class="card"><a class="btn primary" href="#end">Véhicule terminé</a></div>`;$('#vehicles').appendChild(wrap);const rm=wrap.querySelector('.remove');if(rm)rm.onclick=()=>wrap.remove();setTimeout(()=>document.getElementById(id).scrollIntoView({behavior:'smooth'}),50)}
function checked(name,root=document){const x=root.querySelector(`input[name="${name}"]:checked`);return x?x.value:''}
function ascii(s=''){return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[–—]/g,'-').replace(/[^\x20-\x7E]/g,' ')}
function fmtDate(s){if(!s)return '';const a=s.split('-');return a.length===3?`${a[2]}/${a[1]}/${a[0]}`:s}
async function fileToJpeg(file){if(!file)return null;const url=URL.createObjectURL(file);try{const img=await new Promise((ok,no)=>{const x=new Image();x.onload=()=>ok(x);x.onerror=no;x.src=url});const max=1700,sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.max(1,Math.round(img.naturalWidth*sc)),h=Math.max(1,Math.round(img.naturalHeight*sc));const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);const data=c.toDataURL('image/jpeg',.80);const bin=atob(data.split(',')[1]),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return {bytes,w,h}}finally{URL.revokeObjectURL(url)}}
function bytes(s){return new TextEncoder().encode(s)}function join(parts){const n=parts.reduce((a,b)=>a+b.length,0),o=new Uint8Array(n);let p=0;for(const b of parts){o.set(b,p);p+=b.length}return o}
function makePdf(pages){const objs=[null];const add=x=>(objs.push(x),objs.length-1);const font=add(bytes('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>'));const pagesId=add(null),pageIds=[];for(const pg of pages){let imgId=null;if(pg.image){const h=bytes(`<< /Type /XObject /Subtype /Image /Width ${pg.image.w} /Height ${pg.image.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${pg.image.bytes.length} >>\nstream\n`),t=bytes('\nendstream');imgId=add(join([h,pg.image.bytes,t]))}let c='BT /F1 17 Tf 45 797 Td ('+ascii(pg.title).replace(/[\\()]/g,m=>'\\'+m)+') Tj ET\n';let y=770;for(const line of (pg.lines||[])){c+=`BT /F1 11 Tf 45 ${y} Td (${ascii(line).replace(/[\\()]/g,m=>'\\'+m)}) Tj ET\n`;y-=17}if(pg.image){const mw=505,mh=Math.min(650,y-40),sc=Math.min(mw/pg.image.w,mh/pg.image.h),dw=pg.image.w*sc,dh=pg.image.h*sc,x=(595-dw)/2,iy=Math.max(35,y-dh-12);c+=`q ${dw.toFixed(2)} 0 0 ${dh.toFixed(2)} ${x.toFixed(2)} ${iy.toFixed(2)} cm /Im1 Do Q\n`}const cb=bytes(c),cid=add(join([bytes(`<< /Length ${cb.length} >>\nstream\n`),cb,bytes('endstream')]));let res=`<< /Font << /F1 ${font} 0 R >>`;if(imgId)res+=` /XObject << /Im1 ${imgId} 0 R >>`;res+=' >>';pageIds.push(add(bytes(`<< /Type /Page /Parent ${pagesId} 0 R /MediaBox [0 0 595 842] /Resources ${res} /Contents ${cid} 0 R >>`)))}objs[pagesId]=bytes(`<< /Type /Pages /Count ${pageIds.length} /Kids [${pageIds.map(i=>i+' 0 R').join(' ')}] >>`);const catalog=add(bytes(`<< /Type /Catalog /Pages ${pagesId} 0 R >>`));const out=[bytes('%PDF-1.4\n%PDFGEN\n')],offsets=[0];let off=out[0].length;for(let i=1;i<objs.length;i++){offsets[i]=off;const a=bytes(`${i} 0 obj\n`),b=bytes('\nendobj\n');out.push(a,objs[i],b);off+=a.length+objs[i].length+b.length}const xoff=off;let x=`xref\n0 ${objs.length}\n0000000000 65535 f \n`;for(let i=1;i<objs.length;i++)x+=String(offsets[i]).padStart(10,'0')+' 00000 n \n';x+=`trailer\n<< /Size ${objs.length} /Root ${catalog} 0 R >>\nstartxref\n${xoff}\n%%EOF`;out.push(bytes(x));return new Blob([join(out)],{type:'application/pdf'})}
async function gatherSide(vehicle,sideKey,label,pages,errors){const root=vehicle.querySelector(`[id$="_${sideKey}"]`);const prefix=root.id;const embk=checked(prefix+'_embk',root),coil=checked(prefix+'_coil',root);if(!embk)errors.push(`${vehicle.querySelector('.vehicle-number').value||'Véhicule'} - ${label}: réponse EMBK manquante`);if(!coil)errors.push(`${vehicle.querySelector('.vehicle-number').value||'Véhicule'} - ${label}: réponse bobine manquante`);const res=root.querySelector('.res-value').value.trim();pages.push({title:`EMBK ${label}`,lines:[`Meme EMBK reutilise : ${embk||'Non renseigne'}`,`Meme bobine reutilisee : ${coil||'Non renseigne'}`,`Valeur de resistance : ${res?res+' ohms':'Non renseignee'}`]});const inputs=$$('input[type=file]',root);for(const inp of inputs){if(embk==='Oui'&&inp.closest('.replacement'))continue;const f=inp.files&&inp.files[0];if(!f){errors.push(`${vehicle.querySelector('.vehicle-number').value||'Véhicule'} - ${label}: ${inp.dataset.label} manquante`);continue}const image=await fileToJpeg(f);pages.push({title:`EMBK ${label}`,lines:[inp.dataset.label],image})}}
async function generate(){const st=$('#status');st.className='status show';st.textContent='Génération du PDF en cours...';try{const train=$('#train').value.trim(),baseDate=$('#baseDate').value,baseOp=$('#baseOperator').value.trim(),dc=checked('dateCommon'),oc=checked('opCommon');const vehicles=$$('.vehicle');const errors=[];if(!train)errors.push('Numéro du train manquant');if(!baseDate)errors.push('Date initiale manquante');if(!baseOp)errors.push('Opérateur manquant');if(!dc)errors.push('Indique si la date est commune');if(!oc)errors.push('Indique si l’opérateur est commun');if(!vehicles.length)errors.push('Aucun véhicule');const pages=[];for(const v of vehicles){const num=v.querySelector('.vehicle-number').value.trim(),vd=v.querySelector('.vehicle-date').value,vo=v.querySelector('.vehicle-operator').value.trim(),date=dc==='Oui'?baseDate:vd,op=oc==='Oui'?baseOp:vo;if(!num)errors.push('Numéro de véhicule manquant');if(!date)errors.push(`${num||'Véhicule'}: date manquante`);if(!op)errors.push(`${num||'Véhicule'}: opérateur manquant`);pages.push({title:'RAPPORT EMBK',lines:[`Numero du train : ${train}`,`Numero du vehicule : ${num}`,`Date : ${fmtDate(date)}`,`Operateur : ${op}`]});await gatherSide(v,'left','GAUCHE',pages,errors);await gatherSide(v,'right','DROIT',pages,errors)}if(errors.length){st.className='status show warn';st.innerHTML='<b>Il manque des informations :</b><br>'+errors.map(e).join('<br>');return}const blob=makePdf(pages),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`Rapport_EMBK_${train.replace(/[^A-Za-z0-9_-]/g,'_')}.pdf`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);st.className='status show';st.textContent='PDF généré. Le téléchargement a été lancé.'}catch(err){console.error(err);st.className='status show warn';st.textContent='Erreur pendant la génération : '+err.message}}
$('#addVehicle').onclick=addVehicle;$('#addVehicleBottom').onclick=addVehicle;$('#generatePdf').onclick=generate;$('#generatePdfBottom').onclick=generate;addVehicle();
})();
</script>
</body></html>
