<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Retour sauvegarde photos EMBK</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}main{max-width:720px;margin:auto;padding:24px}.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 2px 14px #0001}h1{font-size:25px;margin:0 0 12px}p{line-height:1.5;color:#475569}.btn{width:100%;border:0;border-radius:14px;padding:16px;font-weight:800;font-size:17px;margin-top:12px}.green{background:#047857;color:#fff}.gray{background:#e5e7eb;color:#111827}.status{margin-top:16px;padding:14px;border-radius:12px;background:#f8fafc;white-space:pre-wrap;font-size:14px}.ok{background:#ecfdf5;color:#065f46}.warn{background:#fff7ed;color:#9a3412}</style></head><body><main><div class="card"><h1>Retour avant récupération des photos</h1><p>Cette page cherche la copie exacte créée juste avant l’outil de récupération. Elle ne fusionne rien. Avant de restaurer, elle garde aussi une copie de l’état actuel.</p><button id="scan" class="btn gray">Vérifier la copie disponible</button><button id="restore" class="btn green">Restaurer l’état avant récupération</button><div id="status" class="status">Prêt.</div></div></main><script>'use strict';const DB='embk-safe-backup-v2',STORE='backups',CURRENT='current-complete';const $=s=>document.querySelector(s),status=$('#status');function openDb(){return new Promise((ok,no)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE)};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function keys(){const db=await openDb();return new Promise((ok,no)=>{const r=db.transaction(STORE).objectStore(STORE).getAllKeys();r.onsuccess=()=>ok(r.result||[]);r.onerror=()=>no(r.error)})}async function get(key){const db=await openDb();return new Promise((ok,no)=>{const r=db.transaction(STORE).objectStore(STORE).get(key);r.onsuccess=()=>ok(r.result||null);r.onerror=()=>no(r.error)})}async function put(key,val){const db=await openDb();return new Promise((ok,no)=>{const t=db.transaction(STORE,'readwrite');t.objectStore(STORE).put(val,key);t.oncomplete=()=>ok();t.onerror=()=>no(t.error)})}async function latestBefore(){const ks=(await keys()).filter(k=>String(k).startsWith('before-photo-recovery-')).sort((a,b)=>Number(String(b).split('-').pop())-Number(String(a).split('-').pop()));if(!ks.length)return null;return{key:ks[0],data:await get(ks[0])}}function countPhotos(d){let n=0;(d?.vehicles||[]).forEach(v=>['left','right'].forEach(s=>(v?.sides?.[s]?.photos||[]).forEach(p=>{if(p&&p.blob)n++})));return n}$('#scan').onclick=async()=>{try{const x=await latestBefore();if(!x){status.className='status warn';status.textContent='Aucune copie avant récupération trouvée. Ne restaure rien.';return}status.className='status ok';status.textContent='Copie trouvée ✓\nVéhicules : '+(x.data?.vehicles?.length||0)+'\nPhotos : '+countPhotos(x.data)+'\n\nAucune donnée n’a été modifiée.'}catch(e){status.className='status warn';status.textContent='Erreur : '+(e.message||e)}};$('#restore').onclick=async()=>{try{const x=await latestBefore();if(!x)throw new Error('Aucune copie avant récupération trouvée');const current=await get(CURRENT);if(current)await put('before-rollback-'+Date.now(),current);await put(CURRENT,x.data);status.className='status ok';status.textContent='État avant récupération restauré ✓\n'+(x.data?.vehicles?.length||0)+' véhicule(s), '+countPhotos(x.data)+' photo(s).\n\nUne copie de l’état actuel a aussi été conservée. Ouvre maintenant fresh.html et fais « Reprendre le brouillon » une seule fois.'}catch(e){status.className='status warn';status.textContent='Erreur : '+(e.message||e)}};</script></body></html>
