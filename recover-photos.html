<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Récupération photos EMBK</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}main{max-width:720px;margin:auto;padding:24px}.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 2px 14px #0001;margin-bottom:16px}h1{font-size:25px;margin:0 0 12px}p{line-height:1.5;color:#475569}.btn{width:100%;border:0;border-radius:14px;padding:16px;font-weight:800;font-size:17px;margin-top:12px}.green{background:#047857;color:#fff}.gray{background:#e5e7eb;color:#111827}.status{margin-top:16px;padding:14px;border-radius:12px;background:#f8fafc;white-space:pre-wrap;font-size:14px}.ok{background:#ecfdf5;color:#065f46}.warn{background:#fff7ed;color:#9a3412}</style></head><body><main><div class="card"><h1>Récupération des photos EMBK</h1><p>Cet outil cherche les photos dans toutes les sauvegardes locales connues de l’application. Avant toute modification, il crée une copie exacte de la sauvegarde actuelle. Il ne supprime aucune ancienne sauvegarde.</p><button id="scan" class="btn gray">Analyser les sauvegardes</button><button id="recover" class="btn green">Récupérer toutes les photos</button><div id="status" class="status">Prêt.</div></div></main><script>
'use strict';
const LEGACY_DB='embk-safe-draft-v1',LEGACY_STORE='drafts',LEGACY_KEY='current';
const SAFE_DB='embk-safe-backup-v2',SAFE_STORE='backups',SAFE_CURRENT='current-complete',SAFE_LEGACY='legacy-before-photo-fix';
const labels=['Ancien numéro de série - Photo 1','Ancien numéro de série - Photo 2','EMBK utilisé pour le remplacement - Photo 1','EMBK utilisé pour le remplacement - Photo 2','État de la bobine','Mesure de résistance','Nouveau numéro de série'];
const $=s=>document.querySelector(s),status=$('#status');
function openDb(name,store){return new Promise((ok,no)=>{const r=indexedDB.open(name,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(store))r.result.createObjectStore(store)};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function get(name,store,key){const db=await openDb(name,store);return new Promise((ok,no)=>{const r=db.transaction(store).objectStore(store).get(key);r.onsuccess=()=>ok(r.result||null);r.onerror=()=>no(r.error)})}
async function put(name,store,key,val){const db=await openDb(name,store);return new Promise((ok,no)=>{const t=db.transaction(store,'readwrite');t.objectStore(store).put(val,key);t.oncomplete=()=>ok();t.onerror=()=>no(t.error)})}
function timeOf(d){return Number(d&&d.savedAt)||0}
function normalizeSource(raw,name){if(!raw)return null;const d=raw.draft||raw.snapshot||raw;if(!d||!Array.isArray(d.vehicles))return null;return{name,data:d,time:timeOf(d)}}
function mapPhotos(so){const out={};if(!so||!Array.isArray(so.photos))return out;const arr=so.photos;const hasLabels=arr.some(p=>p&&p.label);if(hasLabels){for(const p of arr){if(!p||!p.blob)continue;let lab=String(p.label||'');if(lab.startsWith('Photo de la casse'))lab='Photo de la casse';if(lab)out[lab]=p}return out}
const order=arr.length>=8?['Photo de la casse',...labels]:labels;arr.forEach((p,i)=>{if(p&&p.blob&&order[i])out[order[i]]={...p,label:order[i]}});return out}
function vehicleKey(vo,i){const n=String(vo&&vo.number||'').trim();return n?'n:'+n:'i:'+i}
async function readSources(){const safe=await get(SAFE_DB,SAFE_STORE,SAFE_CURRENT).catch(()=>null);const oldbox=await get(SAFE_DB,SAFE_STORE,SAFE_LEGACY).catch(()=>null);const legacy=await get(LEGACY_DB,LEGACY_STORE,LEGACY_KEY).catch(()=>null);return[normalizeSource(safe,'sauvegarde complète'),normalizeSource(legacy,'brouillon principal'),normalizeSource(oldbox,'copie de sécurité ancienne')].filter(Boolean).sort((a,b)=>b.time-a.time)}
function stats(sources){let photos=0,vehicles=new Set();for(const s of sources){s.data.vehicles.forEach((v,i)=>{vehicles.add(vehicleKey(v,i));for(const k of ['left','right'])photos+=Object.keys(mapPhotos(v.sides&&v.sides[k])).length})}return{photos,vehicles:vehicles.size}}
async function merge(){const sources=await readSources();if(!sources.length)throw new Error('Aucune sauvegarde locale trouvée.');const byVehicle=new Map();for(const s of sources){s.data.vehicles.forEach((vo,i)=>{const key=vehicleKey(vo,i);if(!byVehicle.has(key))byVehicle.set(key,{number:vo.number||'',date:vo.date||'',operator:vo.operator||'',sides:{left:{photos:{}},right:{photos:{}}}});const m=byVehicle.get(key);if(!m.number&&vo.number)m.number=vo.number;if(!m.date&&vo.date)m.date=vo.date;if(!m.operator&&vo.operator)m.operator=vo.operator;for(const sideName of ['left','right']){const so=vo.sides&&vo.sides[sideName];if(!so)continue;const ms=m.sides[sideName];for(const fld of ['embk','coil','tests','damageCause','res'])if(!ms[fld]&&so[fld])ms[fld]=so[fld];const mapped=mapPhotos(so);for(const [lab,p] of Object.entries(mapped))if(!ms.photos[lab])ms.photos[lab]=p}})}
const newest=sources[0].data;const merged={version:99,recoveredAt:Date.now(),savedAt:Date.now(),train:newest.train||'',baseDate:newest.baseDate||'',baseOperator:newest.baseOperator||'',dateCommon:newest.dateCommon||'',opCommon:newest.opCommon||'',vehicles:[]};for(const m of byVehicle.values()){const vo={number:m.number,date:m.date,operator:m.operator,sides:{}};for(const sideName of ['left','right']){const ms=m.sides[sideName],photos=[];for(const lab of ['Photo de la casse',...labels]){const p=ms.photos[lab];photos.push(p?{index:photos.length,label:lab,name:p.name||'photo.jpg',type:p.type||'image/jpeg',lastModified:p.lastModified||Date.now(),blob:p.blob}:null)}vo.sides[sideName]={embk:ms.embk||'',coil:ms.coil||'',tests:ms.tests||'',damageCause:ms.damageCause||'',res:ms.res||'',photos}}merged.vehicles.push(vo)}return{sources,merged}}
$('#scan').onclick=async()=>{try{const s=await readSources(),st=stats(s);status.className='status ok';status.textContent='Sauvegardes trouvées : '+s.length+'\nVéhicules repérés : '+st.vehicles+'\nPhotos repérées dans les différentes copies : '+st.photos+'\n\nAucune donnée n’a été modifiée.'}catch(e){status.className='status warn';status.textContent='Erreur : '+(e.message||e)}};
$('#recover').onclick=async()=>{try{status.className='status';status.textContent='Récupération en cours…';const {sources,merged}=await merge();const current=await get(SAFE_DB,SAFE_STORE,SAFE_CURRENT).catch(()=>null);const stamp=Date.now();if(current)await put(SAFE_DB,SAFE_STORE,'before-photo-recovery-'+stamp,current);await put(SAFE_DB,SAFE_STORE,'recovered-all-photos-'+stamp,merged);await put(SAFE_DB,SAFE_STORE,SAFE_CURRENT,merged);let count=0;merged.vehicles.forEach(v=>['left','right'].forEach(k=>(v.sides[k].photos||[]).forEach(p=>{if(p&&p.blob)count++})));status.className='status ok';status.textContent='Récupération terminée ✓\n'+merged.vehicles.length+' véhicule(s) regroupé(s).\n'+count+' photo(s) disponibles dans la sauvegarde récupérée.\n\nLa sauvegarde précédente a été copiée avant la récupération. Tu peux maintenant rouvrir fresh.html et appuyer une seule fois sur « Reprendre le brouillon ».'}catch(e){status.className='status warn';status.textContent='Erreur de récupération : '+(e&&e.message?e.message:String(e))}};
</script></body></html>
