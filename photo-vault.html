<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Coffre photos EMBK</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}main{max-width:900px;margin:auto;padding:20px}.card{background:#fff;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 2px 12px #0001}h1{font-size:26px}button{width:100%;padding:16px;border:0;border-radius:14px;font-weight:800;font-size:17px;background:#e5e7eb}.status{white-space:pre-wrap;margin-top:12px;color:#475569}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.photo{background:#fff;border-radius:14px;padding:10px;box-shadow:0 1px 8px #0001}.photo img{width:100%;height:190px;object-fit:contain;background:#111;border-radius:10px}.meta{font-size:12px;line-height:1.35;margin-top:7px;word-break:break-word}.save{display:block;text-align:center;text-decoration:none;margin-top:8px;padding:10px;border-radius:10px;background:#047857;color:#fff;font-weight:700}@media(max-width:600px){.grid{grid-template-columns:1fr}.photo img{height:260px}}</style></head><body><main><div class="card"><h1>Coffre des photos EMBK</h1><p>Cette page est en lecture seule : elle ne modifie, ne fusionne et ne supprime aucune sauvegarde. Elle affiche chaque photo encore présente dans IndexedDB, y compris les copies de sécurité.</p><button id="scan">Afficher toutes les photos retrouvées</button><div id="status" class="status">Prêt.</div></div><div id="grid" class="grid"></div></main><script>'use strict';const DBs=[['embk-safe-backup-v2','backups'],['embk-safe-draft-v1','drafts']];const $=s=>document.querySelector(s);function odb(n,s){return new Promise((ok,no)=>{const r=indexedDB.open(n);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function all(n,s){try{const db=await odb(n,s);if(!db.objectStoreNames.contains(s))return[];return await new Promise((ok,no)=>{const tx=db.transaction(s),st=tx.objectStore(s),r=st.openCursor(),out=[];r.onsuccess=()=>{const c=r.result;if(!c)return ok(out);out.push({key:String(c.key),value:c.value});c.continue()};r.onerror=()=>no(r.error)})}catch(e){return[]}}function draft(x){const d=x&&x.value;return d&&(d.draft||d.snapshot||d)}function collectBlob(p){if(!p)return null;const b=p.blob||p.file||p;if(b instanceof Blob)return b;return null}async function scan(){const status=$('#status'),grid=$('#grid');grid.innerHTML='';status.textContent='Analyse en cours…';let found=[],seen=new Set;for(const [dbn,store] of DBs){for(const rec of await all(dbn,store)){const d=draft(rec);if(!d||!Array.isArray(d.vehicles))continue;d.vehicles.forEach((v,vi)=>['left','right'].forEach(side=>{const so=v.sides&&v.sides[side];(so&&so.photos||[]).forEach((p,pi)=>{const b=collectBlob(p);if(!b)return;const id=[b.size,b.type,p&&p.name,p&&p.lastModified].join('|');const duplicate=seen.has(id);seen.add(id);found.push({b,p,dbn,key:rec.key,savedAt:d.savedAt||0,vehicle:v.number||('Véhicule '+(vi+1)),side,index:pi+1,duplicate})})}))}}found.sort((a,b)=>(b.savedAt||0)-(a.savedAt||0));for(const x of found){const url=URL.createObjectURL(x.b),el=document.createElement('div');el.className='photo';const dt=x.savedAt?new Date(x.savedAt).toLocaleString('fr-FR'):'date inconnue';el.innerHTML='<img><div class="meta"><b>'+esc(x.vehicle)+' — EMBK '+esc(x.side==='left'?'gauche':'droit')+'</b><br>Position sauvegardée : '+x.index+'<br>Copie : '+esc(x.key)+'<br>Date sauvegarde : '+esc(dt)+(x.duplicate?'<br><b>Doublon détecté</b>':'')+'</div><a class="save">Enregistrer cette photo</a>';el.querySelector('img').src=url;const a=el.querySelector('a');a.href=url;a.download=(x.p&&x.p.name)||('EMBK-'+x.vehicle+'-'+x.side+'-'+x.index+'.jpg');grid.appendChild(el)}status.textContent=found.length+' occurrence(s) de photo retrouvée(s), dont '+seen.size+' photo(s) distincte(s).\nAucune sauvegarde n’a été modifiée.'}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}$('#scan').onclick=scan;</script></body></html>
